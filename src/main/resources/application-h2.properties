# H2 In-Memory Profile (jalan tanpa PostgreSQL; data hilang saat aplikasi berhenti)
# Jalankan dengan: --spring.profiles.active=h2

# Database (H2 in-memory, mode kompatibel PostgreSQL)
spring.datasource.url=jdbc:h2:mem:ikobana_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# JWT (hanya untuk lokal)
jwt.secret=h2_local_secret_key_for_testing_min_32_characters_long_only
jwt.expiration=3600000
