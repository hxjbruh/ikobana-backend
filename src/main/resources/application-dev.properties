# Development Environment Configuration

# Server
server.port=8080
debug=true

# Database (Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/ikobana_db_dev
spring.datasource.username=postgres
spring.datasource.password=postgres123

# JPA/Hibernate (Development - create-drop untuk testing)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Logging (Development - verbose)
logging.level.com.ikobana.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.hibernate=DEBUG

# JWT (Development - test secret)
jwt.secret=dev_secret_key_for_testing_min_32_characters_long_dev_only
jwt.expiration=3600000

# Swagger/OpenAPI (untuk development)
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
